<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="taBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="taGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#fcb728"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="taBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2837fc"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="taGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Nền bo góc cao cấp -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#taBgGrad)" stroke="url(#taGoldGrad)" stroke-width="1.8"/>

  <!-- Vòng sóng âm thanh trang trí (Audio Waves) -->
  <path d="M 8 32 A 24 24 0 0 1 14 18" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <path d="M 56 32 A 24 24 0 0 1 50 18" fill="none" stroke="#fcb728" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <path d="M 12 32 A 20 20 0 0 0 16 43" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>
  <path d="M 52 32 A 20 20 0 0 0 48 43" fill="none" stroke="#fcb728" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Biểu tượng Chữ T (Màu Xanh Electric Blue) -->
  <path d="M 17 20 L 33 20 C 34 20 34 22 33 24 L 28 24 L 28 44 C 28 45.5 25.5 45.5 25.5 44 L 25.5 24 L 17 24 C 16 24 16 20 17 20 Z" fill="url(#taBlueGrad)" filter="url(#taGlow)"/>

  <!-- Biểu tượng Chữ A (Màu Vàng Gold) lồng cách điệu -->
  <path d="M 39 18.5 L 49.5 44 C 50 45.2 47.8 46 47 44.5 L 43.8 37 L 34.2 37 L 31 44.5 C 30.2 46 28 45.2 28.5 44 L 39 18.5 Z M 39 24.8 L 35.8 33.2 L 42.2 33.2 Z" fill="url(#taGoldGrad)" filter="url(#taGlow)"/>

  <!-- Tia nhịp âm thanh trung tâm (Equalizer Core Dot) -->
  <circle cx="39" cy="30" r="1.8" fill="#ffffff" opacity="0.9"/>
</svg>
