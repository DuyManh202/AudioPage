<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fcb728"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2837fc"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG LOGO (EMBLEM BADGE) -->
  <g transform="translate(4, 3)">
    <!-- Nền bo góc cao cấp -->
    <rect x="0" y="0" width="44" height="44" rx="11" fill="url(#logoBgGrad)" stroke="url(#logoGold)" stroke-width="1.4"/>

    <!-- Vòng sóng âm thanh trang trí (Audio Waves) -->
    <path d="M 5 22 A 17 17 0 0 1 9 12" fill="none" stroke="#60a5fa" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
    <path d="M 39 22 A 17 17 0 0 1 35 12" fill="none" stroke="#fcb728" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
    <path d="M 8 22 A 14 14 0 0 0 11 30" fill="none" stroke="#60a5fa" stroke-width="1.3" stroke-linecap="round" opacity="0.3"/>
    <path d="M 36 22 A 14 14 0 0 0 33 30" fill="none" stroke="#fcb728" stroke-width="1.3" stroke-linecap="round" opacity="0.3"/>

    <!-- Chữ T (Màu Xanh Electric Blue) -->
    <path d="M 11 14 L 23 14 C 23.8 14 23.8 15.5 23 17 L 19 17 L 19 31 C 19 32 17.5 32 17.5 31 L 17.5 17 L 11 17 C 10.2 17 10.2 14 11 14 Z" fill="url(#logoBlue)" filter="url(#logoGlow)"/>

    <!-- Chữ A (Màu Vàng Gold) lồng sóng -->
    <path d="M 27 13 L 34.5 31 C 34.9 31.8 33.3 32.4 32.7 31.3 L 30.5 26 L 23.5 26 L 21.3 31.3 C 20.7 32.4 19.1 31.8 19.5 31 L 27 13 Z M 27 17.5 L 24.7 23.5 L 29.3 23.5 Z" fill="url(#logoGold)" filter="url(#logoGlow)"/>

    <!-- Điểm sáng trung tâm âm học -->
    <circle cx="27" cy="21.5" r="1.3" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- PHẦN CHỮ THƯƠNG HIỆU (BRAND TYPOGRAPHY) -->
  <g transform="translate(58, 0)">
    <!-- TÚ AUDIO -->
    <text x="0" y="27" font-family="'Montserrat', 'SF Pro Display', 'Arial', sans-serif" font-size="21" font-weight="900" letter-spacing="1">
      <tspan fill="#ffffff">TÚ</tspan>
      <tspan dx="5" fill="url(#logoGold)">AUDIO</tspan>
    </text>

    <!-- Slogan phụ -->
    <text x="1" y="41" font-family="'Montserrat', 'SF Pro Display', 'Arial', sans-serif" font-size="7.8" font-weight="700" fill="#94a3b8" letter-spacing="1.8">
      ÂM THANH CHUẨN PHÒNG HÁT
    </text>

    <!-- Biểu tượng âm thanh mini -->
    <g transform="translate(162, 33)">
      <rect x="0" y="4" width="1.5" height="4" rx="0.75" fill="#fcb728" opacity="0.7"/>
      <rect x="3" y="2" width="1.5" height="6" rx="0.75" fill="#fcb728" opacity="0.9"/>
      <rect x="6" y="0" width="1.5" height="8" rx="0.75" fill="#fcb728"/>
      <rect x="9" y="3" width="1.5" height="5" rx="0.75" fill="#fcb728" opacity="0.8"/>
    </g>
  </g>
</svg>
